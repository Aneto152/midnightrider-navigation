<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MidnightRider — Voiles</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#0a1628;color:#fff;min-height:100vh;padding:12px}
h1{text-align:center;font-size:1.3em;margin-bottom:12px;color:#4fc3f7}
.s{background:#112240;border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid #1e3a5f}
.s h2{font-size:.85em;color:#4fc3f7;text-transform:uppercase;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{padding:14px 6px;border:2px solid #1e3a5f;border-radius:10px;background:#0a1628;color:#fff;font-size:.88em;cursor:pointer;width:100%}
button.on{background:#1565c0;border-color:#4fc3f7}
button.mot{background:#7b1fa2;border-color:#ce93d8}
.bk{display:block;text-align:center;color:#4fc3f7;text-decoration:none;margin-bottom:12px;font-size:.9em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1565c0;color:#fff;padding:10px 20px;border-radius:20px;font-size:.88em;display:none;z-index:999}
</style></head><body>
<h1>⛵ Voiles</h1>
<a class="bk" href="/">⬅ Interface Régate</a>
<div class="s"><h2>⚙️ Mode</h2>
<div class="g2">
<button id="m-v" onclick="sM('voile')">☵ Voile</button>
<button id="m-m" onclick="sM('moteur')">🔥 Moteur</button>
</div></div>
<div id="sdiv">
<div class="s"><h2>☵ Voile d'avant</h2>
<div class="g4">
<button id="fs-J1" onclick="sF('J1')">J1</button>
<button id="fs-J2" onclick="sF('J2')">J2</button>
<button id="fs-J3" onclick="sF('J3')">J3</button>
<button id="fs-Spi" onclick="sF('Spi')">Spi</button>
</div></div>
<div class="s"><h2>☵ Grande voile</h2>
<div class="g3">
<button id="ms-gv" onclick="sMS('GV pleine')">GV pleine</button>
<button id="ms-r1" onclick="sMS('1 ris')">1 ris</button>
<button id="ms-r2" onclick="sMS('2 ris')">2 ris</button>
</div></div></div>
<div class="toast" id="toast"></div>
<script>
var S={md:localStorage.getItem('md')||'voile',fs:localStorage.getItem('fs')||'',ms:localStorage.getItem('ms')||''};
function sv(k,v){localStorage.setItem(k,v)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2000)}
function post(p,d){var x=new XMLHttpRequest();x.open('POST',p);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify(d))}
function sM(m){S.md=m;sv('md',m);document.getElementById('m-v').className=m==='voile'?'on':'';document.getElementById('m-m').className=m==='moteur'?'mot on':'';document.getElementById('sdiv').style.display=m==='moteur'?'none':'block';post('/api/event',{type:'mode',note:m});toast(m==='moteur'?'🔥 Moteur':'☵ Voile')}
function sF(s){['J1','J2','J3','Spi'].forEach(function(x){document.getElementById('fs-'+x).className=''});document.getElementById('fs-'+s).className='on';S.fs=s;sv('fs',s);post('/api/sail',{sail:s,type:'foresail'});toast('☵ Avant: '+s)}
function sMS(s){var m={'GV pleine':'gv','1 ris':'r1','2 ris':'r2'};['gv','r1','r2'].forEach(function(x){document.getElementById('ms-'+x).className=''});document.getElementById('ms-'+m[s]).className='on';S.ms=s;sv('ms',s);post('/api/sail',{sail:s,type:'mainsail'});toast('☵ GV: '+s)}
sM(S.md);
if(S.fs){var e=document.getElementById('fs-'+S.fs);if(e)e.className='on'}
if(S.ms){var mm={'GV pleine':'gv','1 ris':'r1','2 ris':'r2'},e2=document.getElementById('ms-'+mm[S.ms]);if(e2)e2.className='on'}
</script></body></html>
