<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/css/night-mode.css">
    <title>Reporter — Midnight Rider</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1628;
            color: #e0e8f0;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            font-size: 1.1em;
            opacity: 0.7;
            padding: 12px 0 20px;
        }
        
        .btn {
            width: 100%;
            background: #1a5c3a;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
            transition: opacity 0.2s;
        }
        
        .btn:active {
            opacity: 0.6;
        }
        
        .btn.loading {
            background: #2a3a2a;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status {
            text-align: center;
            font-size: 0.85em;
            margin-bottom: 16px;
            min-height: 20px;
            color: #7bb8f0;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .card .time {
            font-size: 0.72em;
            opacity: 0.5;
            margin-bottom: 6px;
        }
        
        .card .text {
            font-size: 0.9em;
            line-height: 1.55;
        }
        
        .empty {
            text-align: center;
            opacity: 0.4;
            font-size: 0.85em;
            padding: 20px;
        }
        
        .back {
            display: block;
            text-align: center;
            color: #7bb8f0;
            text-decoration: none;
            font-size: 0.85em;
            margin-top: 16px;
            opacity: 0.7;
        }
        
        h2 {
            font-size: 0.85em;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <h1>📡 Midnight Reporter</h1>
    <button class="btn" id="btn" onclick="generate()">🎙️ Générer un flash famille</button>
    <div class="status" id="status"></div>
    <h2>Derniers flashs</h2>
    <div id="history"><div class="empty">Aucun flash généré</div></div>
    <a class="back" href="/">← Retour</a>
    
    <script>
        async function generate() {
            const btn = document.getElementById('btn');
            const st = document.getElementById('status');
            btn.classList.add('loading');
            btn.textContent = '⏳ Génération en cours…';
            st.textContent = 'OC analyse polar, météo, vent, concurrents…';
            
            try {
                const r = await fetch('/api/reporter/generate', { method: 'POST' });
                const d = await r.json();
                st.textContent = d.message || 'Flash généré ✅';
                setTimeout(loadHistory, 3000);
            } catch (e) {
                st.textContent = '❌ ' + e.message;
            }
            
            btn.classList.remove('loading');
            btn.textContent = '🎙️ Générer un flash famille';
        }
        
        async function loadHistory() {
            try {
                const r = await fetch('/api/reporter/history');
                if (!r.ok) return;
                const entries = await r.json();
                const div = document.getElementById('history');
                if (!entries || !entries.length) {
                    div.innerHTML = '<div class="empty">Aucun flash</div>';
                    return;
                }
                div.innerHTML = entries.slice(-5).reverse().map(e =>
                    '<div class="card"><div class="time">' + 
                    new Date(e.time).toLocaleString('fr-FR') + 
                    '</div><div class="text">' + 
                    (e.text || '').replace(/\n/g, '<br>') + 
                    '</div></div>'
                ).join('');
            } catch (e) {}
        }
        
        loadHistory();
    </script>
</body>
</html>
