<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="/static/css/night-mode.css">
<title>Reporter — Midnight Rider</title>
<style>
  body { padding: 20px; max-width: 480px; margin: 0 auto; min-height: 100vh; }
  h1 { text-align: center; font-size: 1.1em; opacity: 0.75; padding: 14px 0 22px; }
  .generate-btn {
    width: 100%; background: var(--bg-btn-primary); color: #fff;
    border: none; border-radius: var(--radius-lg); padding: 18px;
    font-size: 1.1em; font-weight: 600; cursor: pointer; margin-bottom: 16px;
    transition: opacity 0.2s; font-family: var(--font-sans);
  }
  .generate-btn:hover { opacity: 0.9; }
  .generate-btn.loading { background: #2a3a2a; animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .status { text-align: center; font-size: 0.85em; margin-bottom: 16px; color: var(--text-link); }
  .section-title { font-size: 0.8em; opacity: 0.45; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
  .flash-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
  .flash-card .time { font-size: 0.72em; opacity: 0.45; margin-bottom: 7px; }
  .flash-card .text { font-size: 0.9em; line-height: 1.6; }
  .back-link { display: block; text-align: center; color: var(--text-link); font-size: 0.85em; margin-top: 20px; opacity: 0.7; }
  .back-link:hover { opacity: 1; }
</style>
</head>
<body>
  <h1>📡 Midnight Reporter</h1>
  <button class="generate-btn" id="btn" onclick="generate()">🎯 Generate a family flash</button>
  <div class="status" id="status"></div>
  <h2 class="section-title">Recent flashes</h2>
  <div id="history"><div class="mr-empty">No flash generated yet</div></div>
  <a class="back-link" href="/">← Back to Portal</a>
  <script>
    async function generate() {
      const btn = document.getElementById('btn');
      const st  = document.getElementById('status');
      btn.classList.add('loading');
      btn.textContent = '⏳ Generating…';
      st.textContent  = 'Analysing polar, weather, wind, competitors…';
      try {
        const r = await fetch('/api/reporter/generate', { method: 'POST' });
        const d = await r.json();
        st.textContent = d.message || 'Flash generated ✅';
        let polls = 0;
        const poll = setInterval(async () => {
          polls++;
          await loadHistory();
          const entries = document.querySelectorAll('.flash-card');
          if (entries.length > 0 || polls >= 9) {
            clearInterval(poll);
            if (polls >= 9) st.textContent = '⚠️ Timeout — reporter may still be running';
          }
        }, 10000);
      } catch (e) {
        st.textContent = '❌ ' + e.message;
      }
      btn.classList.remove('loading');
      btn.textContent = '🎯 Generate a family flash';
    }
    async function loadHistory() {
      try {
        const r = await fetch('/api/reporter/history');
        if (!r.ok) return;
        const entries = await r.json();
        const div = document.getElementById('history');
        if (!entries || !entries.length) {
          div.innerHTML = '<div class="mr-empty">No flash generated yet</div>';
          return;
        }
        div.innerHTML = entries.slice(-5).reverse().map(e =>
          `<div class="flash-card"><div class="time">${new Date(e.time).toLocaleString('en-US')}</div><div class="text">${(e.text || '').replace(/\n/g, '<br>')}</div></div>`
        ).join('');
      } catch (e) {}
    }
    loadHistory();
  </script>
</body>
</html>
