<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fleet Database — Midnight Rider</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a1628;color:#e0e8f0;min-height:100vh;padding-bottom:20px}
a{color:#7bb8f0;text-decoration:none}
.nav{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(0,212,255,0.15);background:rgba(0,0,0,0.3)}
.nav-title{font-size:0.85em;font-weight:600;opacity:0.9}
.nav a{font-size:0.8em;opacity:0.7;padding:6px 10px}
.summary{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;border-bottom:1px solid rgba(0,212,255,0.1)}
.sum-item{flex:1;min-width:70px;text-align:center;padding:8px;background:rgba(255,255,255,0.04);border-radius:8px;border:1px solid rgba(0,212,255,0.1)}
.sum-num{font-size:1.5em;font-weight:700;display:block}
.sum-lbl{font-size:0.65em;opacity:0.5;text-transform:uppercase;letter-spacing:0.05em}
.sum-item.live .sum-num{color:#22c55e}
.sum-item.stale .sum-num{color:#eab308}
.sum-item.absent .sum-num{color:rgba(255,255,255,0.3)}
.controls{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:140px;padding:8px 12px;background:rgba(255,255,255,0.07);border:1px solid rgba(0,212,255,0.2);border-radius:8px;color:#e0e8f0;font-size:0.85em;outline:none}
.search::placeholder{opacity:0.4}
.search:focus{border-color:rgba(0,212,255,0.5);background:rgba(255,255,255,0.1)}
.filter-group{display:flex;gap:4px;flex-wrap:wrap}
.fbtn{padding:5px 10px;border:1px solid rgba(0,212,255,0.2);border-radius:6px;background:rgba(255,255,255,0.04);color:#e0e8f0;cursor:pointer;font-size:0.75em;transition:all 0.15s}
.fbtn:hover,.fbtn.active{background:rgba(0,212,255,0.12);border-color:rgba(0,212,255,0.45)}
.fbtn.active{font-weight:600}
.fbtn.live.active{background:rgba(34,197,94,0.15);border-color:#22c55e}
.fbtn.stale.active{background:rgba(234,179,8,0.15);border-color:#eab308}
.fbtn.absent.active{background:rgba(255,255,255,0.07)}
.result-count{padding:2px 12px 6px;font-size:0.72em;opacity:0.4}
.boat-list{padding:0 12px}
.boat-row{display:grid;grid-template-columns:1fr 72px 60px 52px 40px;gap:6px;padding:9px 10px;margin:3px 0;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.05);align-items:center}
.boat-row.live{border-left:3px solid #22c55e}
.boat-row.stale{border-left:3px solid #eab308}
.boat-row.old{border-left:3px solid rgba(255,165,0,0.4)}
.boat-row.absent{border-left:3px solid rgba(255,255,255,0.1);opacity:0.65}
.boat-row:hover{background:rgba(255,255,255,0.07)}
.boat-name{font-size:0.84em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boat-class{font-size:0.68em;opacity:0.5;margin-top:1px}
.cell{font-size:0.78em;text-align:right;font-weight:500}
.cell.dim{opacity:0.45;font-size:0.72em}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:0.68em;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}
.badge.live{background:rgba(34,197,94,0.2);color:#22c55e}
.badge.stale{background:rgba(234,179,8,0.2);color:#eab308}
.badge.old{background:rgba(255,165,0,0.15);color:rgba(255,165,0,0.8)}
.badge.absent{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.3)}
.empty{text-align:center;padding:40px 20px;opacity:0.4;font-size:0.88em}
.loading{text-align:center;padding:30px;opacity:0.4;font-size:0.85em}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,212,255,0.3);border-top-color:#00d4ff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@media(max-width:380px){
  .boat-row{grid-template-columns:1fr 64px 54px 44px 36px}
}
</style>
</head>
<body>

<div class="nav">
  <span class="nav-title">⛵ Fleet Database</span>
  <div>
    <a href="/ais/">← Tracker</a>
    <a href="/">Portal</a>
  </div>
</div>

<div class="summary" id="summary">
  <div class="sum-item"><span class="sum-num" id="sumTotal">—</span><span class="sum-lbl">Total</span></div>
  <div class="sum-item"><span class="sum-num" id="sumActive">—</span><span class="sum-lbl">Active</span></div>
  <div class="sum-item live"><span class="sum-num" id="sumLive">—</span><span class="sum-lbl">Live AIS</span></div>
  <div class="sum-item stale"><span class="sum-num" id="sumStale">—</span><span class="sum-lbl">Stale</span></div>
  <div class="sum-item absent"><span class="sum-num" id="sumAbsent">—</span><span class="sum-lbl">Absent</span></div>
</div>

<div class="controls">
  <input class="search" id="search" type="text" placeholder="Search name, sail #, MMSI…" oninput="applyFilters()">
  <div class="filter-group">
    <button class="fbtn active" onclick="setFilter('all')">All</button>
    <button class="fbtn live" onclick="setFilter('live')">Live</button>
    <button class="fbtn stale" onclick="setFilter('stale')">Stale</button>
    <button class="fbtn absent" onclick="setFilter('absent')">Absent</button>
  </div>
</div>
<div class="result-count" id="resultCount"></div>

<div class="boat-list" id="boatList">
  <div class="loading"><span class="spinner"></span>Loading fleet…</div>
</div>

<script>
let allBoats=[],filterStatus='all';
function setFilter(f){filterStatus=f;document.querySelectorAll('.fbtn').forEach(b=>{b.classList.toggle('active',b.textContent.toLowerCase()===f||(f==='all'&&b.textContent==='All'))});applyFilters()}
function applyFilters(){const q=document.getElementById('search').value.toLowerCase().trim();let boats=allBoats;if(filterStatus!=='all'){boats=boats.filter(b=>{if(filterStatus==='absent')return b.ais_status==='absent';if(filterStatus==='stale')return b.ais_status==='stale'||b.ais_status==='old';return b.ais_status===filterStatus})}if(q){boats=boats.filter(b=>(b.name||'').toLowerCase().includes(q)||(b.sail_num||'').toLowerCase().includes(q)||(b.mmsi||'').includes(q)||(b.boat_class||'').toLowerCase().includes(q)||(b.skipper||'').toLowerCase().includes(q))}const order={live:0,stale:1,old:2,absent:3};boats.sort((a,b)=>{const d=(order[a.ais_status]||3)-(order[b.ais_status]||3);return d||(a.name||'').localeCompare(b.name||'')});document.getElementById('resultCount').textContent=boats.length+' of '+allBoats.length+' boats';const list=document.getElementById('boatList');if(!boats.length){list.innerHTML='<div class="empty">No boats match your filter</div>';return}list.innerHTML=boats.map(b=>{const phrf=b.phrf_lis!=null?b.phrf_lis:'—';const irc=b.irc_tcc!=null?b.irc_tcc.toFixed(3):'—';const mmsiShort=b.mmsi?b.mmsi.slice(-4):'—';return `<div class="boat-row ${b.ais_status}"><div><div class="boat-name">${b.name||'Unknown'}</div><div class="boat-class">${b.sail_num||''} ${b.boat_class?'· '+b.boat_class:''}</div></div><div class="cell"><span class="badge ${b.ais_status}">${b.ais_status}</span></div><div class="cell">${phrf}<span class="dim"> phrf</span></div><div class="cell dim">···${mmsiShort}</div><div class="cell dim">${b.priority||''}</div></div>`}).join('')}
async function load(){try{const r=await fetch('/api/fleet_db');const d=await r.json();allBoats=d.competitors||[];document.getElementById('sumTotal').textContent=d.total||0;document.getElementById('sumActive').textContent=d.active||0;const live=allBoats.filter(b=>b.ais_status==='live').length;const stale=allBoats.filter(b=>b.ais_status==='stale'||b.ais_status==='old').length;const absent=allBoats.filter(b=>b.ais_status==='absent').length;document.getElementById('sumLive').textContent=live;document.getElementById('sumStale').textContent=stale;document.getElementById('sumAbsent').textContent=absent;applyFilters()}catch(e){document.getElementById('boatList').innerHTML=`<div class="empty">Error loading fleet: ${e.message}</div>`}}
load();
</script>
</body>
</html>
