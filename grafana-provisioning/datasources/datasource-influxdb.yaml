apiVersion: 1

datasources:
  - name: InfluxDB
    uid: efifgp8jvgj5sf
    type: influxdb
    access: proxy
    url: http://localhost:8086
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: MidnightRider
      defaultBucket: midnight_rider
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUX_TOKEN}
