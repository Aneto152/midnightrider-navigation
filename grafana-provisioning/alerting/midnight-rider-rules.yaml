    name: midnight-rider-alerts
    folder: Midnight Rider Alerts
    interval: 1m
    rules:
      # Safety (10)
      - uid: mr-safety-heel
        title: "⛵ Safety: Heel >22°"
        condition: B
        data:
          - refId: A
            datasourceUid: efifgp8jvgj5sf
            model:
              datasource:
                type: influxdb
                uid: efifgp8jvgj5sf
              query: 'from(bucket:"midnight_rider")|>range(start:-2m)|>filter(fn:(r)=>r._measurement=="navigation.attitude" and r._field=="roll")|>last()|>map(fn:(r)=>({r with _value:r._value*57.2958}))'
              refId: A
          - refId: B
            datasourceUid: '-100'
            model:
              type: threshold
              refId: B
              expression: A
              conditions:
                - evaluator:
                    params: [22.0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 30s
        annotations:
          description: "⛵ Safety: Heel >22°"
          category: Safety
        labels:
          severity: critical
          category: Safety

