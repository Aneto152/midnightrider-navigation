; ATTENTION - CE FICHIER N EST PAS CHARGE PAR GRAFANA (constate en H4c).
; Il etait monte sur /etc/grafana/provisioning/grafana.ini, chemin que
; Grafana ne lit jamais : il lit /etc/grafana/grafana.ini. Le montage a
; ete retire en H4d. La configuration EFFECTIVE est dans docker-compose.yml,
; par variables d environnement, qui priment sur tout fichier .ini :
;   GF_SECURITY_ALLOW_EMBEDDING=true
;   GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
;   GF_AUTH_ANONYMOUS_ENABLED=false
; Ce fichier est conserve comme trace d intention et support de test.

[security]
# Allow Grafana to be embedded in iframes from the portal (port 8888)
# Previous SAMEORIGIN setting blocked cross-port (8888→3001) iframe
allow_embedding = true
x_frame_options = 

[dashboards]
# Allow 1s refresh rate for real-time racing instrument data
min_refresh_interval = 1s
